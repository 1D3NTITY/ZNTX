# Nutzt die bereits laufende shared Infrastruktur (Postgres aus /srv/foodapp/infra) über
# das externe Docker-Netzwerk "infra_default" — kein eigener Postgres-Container hier.
# "ports:" ist auf 127.0.0.1 beschränkt, Caddy (Host-systemd-Service) bleibt einziger
# öffentlicher Ingress.
#
# Expliziter "name:" (Pflicht — siehe ravepuls/infra/docker-compose.yml-Kommentar zur
# Namenskollision vom 2026-07-11). Service heißt "zntx-web" (nicht nur "web"): auf dem
# shared Netz "infra_default" vergibt Compose sonst einen Alias, der mit anderen
# Projekten kollidieren könnte.
#
# WICHTIG: wird immer mit `--project-directory .` von /srv/zntx aus aufgerufen (sonst
# findet Compose die Env-Datei im Projekt-Root nicht, siehe docs/plans/portfolio-aufbau.md).
# Das verschiebt auch die Basis für relative Pfade hier im File — deshalb "services/web"
# statt "../services/web" (relativ zu /srv/zntx, nicht zu infra/).
name: zntx

services:
  zntx-web:
    build:
      context: services/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        # Git-SHA-Provenance im Footer (2026-09-07, Recherche-Synthese) — kommt NICHT automatisch
        # von hier, docker-compose kann kein Shell-Kommando ausführen. Der Deploy-Befehl muss
        # GIT_SHA selbst setzen, z.B.:
        #   GIT_SHA=$(git rev-parse --short HEAD) docker compose -f infra/docker-compose.yml \
        #     --project-directory . build zntx-web
        # Ohne gesetztes GIT_SHA fällt es auf "unknown" zurück statt einen falschen Stand zu zeigen.
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=postgresql://zntx_app:${ZNTX_DB_PASSWORD}@postgres:5432/zntx_db
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - CONTACT_EMAIL_TO=${CONTACT_EMAIL_TO:-kontakt@zntx.de}
    ports:
      - "127.0.0.1:3020:3000"

networks:
  default:
    name: infra_default
    external: true
